<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    html, body { height: 100%; }
    body { overflow: hidden; }

    /* Top Navigation Bar */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      background: #0f172a;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 24px;
      z-index: 1000;
    }

    .navbar .logo {
      font-weight: bold;
      font-size: 18px;
      margin-right: 32px;
      white-space: nowrap;
    }

    .navbar a {
      color: #cbd5e1;
      text-decoration: none;
      margin-right: 20px;
      font-size: 14px;
    }
    .navbar a:hover { color: #ffffff; }

    /* Full-screen content area under navbar */
    .content {
      position: fixed;
      top: 60px;  /* same as navbar height */
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: calc(100vh - 60px);
      background: #fff;
    }

    /* Make iframe truly fill the available space */
    .content iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="logo">Company Dashboards</div>
    <a href="#">Overview</a>
    <a href="#">Operations</a>
    <a href="#">Finance</a>
    <a href="#">Performance</a>
  </div>

  <div class="content">
    <iframe
      src="https://lookerstudio.google.com/embed/reporting/de8cbf51-c1ce-4be6-90cf-2f0f078209ea/page/KCTmF"
      allowfullscreen
      sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
    </iframe>
  </div>
</body>
</html>
