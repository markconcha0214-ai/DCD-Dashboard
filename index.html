<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DCD Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
(function () {
  const valid = new Set(["overview","categories","sales","operations"]);
  const page = (location.hash || "#overview").slice(1);
  window.__initialPage = valid.has(page) ? page : "overview";
})();
</script>

<style>
:root {
  --primary-gradient: linear-gradient(135deg, #076caf 0%, #19277a 100%);
}

.navbar-modern {
  background: linear-gradient(135deg, #FAFDFF 0%, #00aeef 100%);
  padding: 0.6rem 0;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
}

.nav-link {
  position: relative;
  margin: 0 3px;
  padding: 0.4rem 0.8rem !important;
  border-radius: 8px;
  transition: all .3s ease;
  color: #e2e8f0 !important;
  font-weight: 500;
  font-size: .9rem;
}

.nav-link:hover {
  background: rgba(102,126,234,.15);
  transform: translateY(-2px);
}

.nav-link.active {
  background: var(--primary-gradient);
  color: white !important;
  box-shadow: 0 4px 15px rgba(102,126,234,.3);
}

.navbar-logo {
  height:40px;
  border-radius:6px;
}

.looker-wrap{
  width:100%;
  height:calc(100vh - 72px);
  min-height:600px;
}

.looker-wrap iframe{
  width:100%;
  height:100%;
  border:0;
}

.page{display:none;}
.page.is-active{display:block;}
</style>
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-modern shadow-lg">
<div class="container-fluid px-3 px-lg-4">

<a class="navbar-brand fw-bold d-flex align-items-center" href="#">
<img src="images/logo.png" class="me-2 navbar-logo">
</a>

<button class="navbar-toggler" type="button"
data-bs-toggle="collapse"
data-bs-target="#mainNavbar">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="mainNavbar">
<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="#overview" onclick="goTo(event,'overview')">
<i class="fas fa-home me-1"></i> Overview
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#categories" onclick="goTo(event,'categories')">
<i class="fas fa-list-alt me-1"></i> Categories
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#sales" onclick="goTo(event,'sales')">
<i class="fas fa-chart-bar me-1"></i> Sales
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#operations" onclick="goTo(event,'operations')">
<i class="fas fa-cogs me-1"></i> Operations
</a>
</li>

</ul>
</div>
</div>
</nav>


<div class="container-fluid px-0">

<!-- Overview -->
<div id="overview" class="page">
<div class="looker-wrap">
<iframe
  data-src="https://datastudio.google.com/embed/reporting/d7a61432-e829-4d5e-aac5-cc40ebff1390/page/U3GwF"
  allowfullscreen 
  sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
</iframe>
</div>
</div>

<!-- Categories -->
<div id="categories" class="page">
<div class="looker-wrap">
<iframe
data-src="https://lookerstudio.google.com/embed/reporting/34365221-f6f2-4abc-b7a1-86a6942a822d/page/KCTmF"
allowfullscreen
sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
</iframe>
</div>
</div>

<!-- Sales -->
<div id="sales" class="page">
<div class="looker-wrap">
<iframe data-src="https://datastudio.google.com/embed/reporting/ac61315d-5b1a-4107-bed4-7ed7ee7e8108/page/U3GwF" frameborder="0" style="border:0" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
</div>
</div>

<!-- Operations -->
<div id="operations" class="page">
<div class="looker-wrap">
<iframe
data-src="https://lookerstudio.google.com/embed/reporting/0b5d72f8-b261-44cb-98b6-2ac890aac087/page/KCTmF"
allowfullscreen 
sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
</iframe>
</div>
</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>

const validPages = new Set(["overview","categories","sales","operations"]);

function loadIframeIfNeeded(pageId){
const iframe=document.querySelector(`#${pageId} iframe`);
if(!iframe)return;
if(!iframe.src){
iframe.src=iframe.dataset.src;
}
}

function refreshIframe(pageId){
const iframe=document.querySelector(`#${pageId} iframe`);
if(!iframe || !iframe.src)return;

const current=iframe.src;
iframe.src="";
setTimeout(()=>{iframe.src=current},50);
}

function renderPage(pageId){

const target=validPages.has(pageId)?pageId:"overview";

document.querySelectorAll(".page").forEach(p=>p.classList.remove("is-active"));
document.getElementById(target).classList.add("is-active");

document.querySelectorAll(".nav-link").forEach(link=>link.classList.remove("active"));
const activeLink=document.querySelector(`.nav-link[href="#${target}"]`);
if(activeLink)activeLink.classList.add("active");

loadIframeIfNeeded(target);

}

function goTo(evt,pageId){

evt.preventDefault();

const target=validPages.has(pageId)?pageId:"overview";
const current=(window.location.hash || "#overview").slice(1);

if(current===target){
refreshIframe(target);
return;
}

window.location.hash=target;
renderPage(target);

}

window.addEventListener("DOMContentLoaded",()=>{
const pageFromHash=(window.location.hash || "#overview").slice(1);
renderPage(pageFromHash);
});

window.addEventListener("hashchange",()=>{
const pageFromHash=(window.location.hash || "#overview").slice(1);
renderPage(pageFromHash);
});

</script>

</body>
</html>
